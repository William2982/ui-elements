<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores WW2</title>
    <style>
        :root {
            --background-color: #2b2b2b;
            /* Gris oscuro */
            --primary-color: #4b5320;
            /* Verde oliva */
            --secondary-color: #6e6e6e;
            /* Gris medio */
            --text-color: #f5f5f5;
            /* Blanco sucio */
            --title-color: #ffd700;
            /* Dorado */

            /* Colores adicionales */
            --highlight-color: #8b4513;
            /* Marrón oscuro */
            --muted-color: #8f9779;
            /* Verde musgo */
            --accent-color: #b22222;
            /* Rojo ladrillo */
            --light-gray: #d3d3d3;
            /* Gris claro */
            --dark-blue: #000080;
            /* Azul marino */
            --steel-gray: #4682b4;
            /* Gris acero */
            --sand-color: #c2b280;
            /* Color arena */
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
        }

        header {
            background-color: var(--primary-color);
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: var(--title-color);
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        section {
            background-color: var(--secondary-color);
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
        }

        footer {
            background-color: var(--primary-color);
            color: var(--text-color);
            text-align: center;
            padding: 10px;
        }

        button {
            background-color: var(--highlight-color);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-color);
        }

        .card {
            background-color: var(--light-gray);
            color: var(--background-color);
            padding: 20px;
            border: 3px solid var(--steel-gray);
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="">link</a>
        </nav>
    </header>

    <section>
        <h3>title</h3>
        <div class="card">texto</div>
        <button>click</button>
    </section>

    <footer>
        <p>a</p>
    </footer>
</body>

</html>
